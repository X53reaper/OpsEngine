services:

  # ── LOCAL POSTGRESQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safarizetu_ops}
      POSTGRES_USER: ${POSTGRES_USER:-ops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops_admin} -d ${POSTGRES_DB:-safarizetu_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ops_network

  # ── LANGFUSE (LLM OBSERVABILITY) ──────────────────────────────
  langfuse:
    image: langfuse/langfuse:2
    container_name: ops_langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops_admin}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${OPS_ENGINE_SECRET}
      - SALT=${OPS_ENGINE_SECRET}
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=false
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$(hostname -i):3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ops_network



  # ── CHROMA VECTOR DB ──────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    container_name: ops_chroma
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - ops_network

  # ── OPS ENGINE (AI AGENTS + WEBHOOKS + CRONS) ─────────────────
  ops-engine:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.ops
    image: safarizetu-ops-engine:latest
    container_name: ops_engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Override DB host to use container service name
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ops_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-safarizetu_ops}
      # Override Chroma URL to use container service name
      - CHROMA_URL=http://chroma:8000
      - LANGFUSE_HOST=http://langfuse:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - engine_logs:/app/logs
      - ../skills:/app/skills
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ops_network

  # ── DASHBOARD (REACT MONITORING UI) ───────────────────────────
  ops-dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      args:
        REACT_APP_OPS_ENGINE_URL: http://ops-engine:3000
    image: safarizetu-ops-dashboard:latest
    container_name: ops_dashboard
    restart: unless-stopped
    depends_on:
      ops-engine:
        condition: service_healthy
    environment:
      - REACT_APP_OPS_ENGINE_URL=http://ops-engine:3000
      - REACT_APP_OPS_API_KEY=${OPS_ENGINE_API_KEY}
      - PORT=3002
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3002 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ops_network

  # ── CLOUDFLARE TUNNEL (SECURE PUBLIC INGRESS) ─────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ops_cloudflared
    restart: unless-stopped
    depends_on:
      ops-engine:
        condition: service_healthy
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - ops_network

networks:
  ops_network:
    driver: bridge
    name: safarizetu_ops

volumes:
  postgres_data:
  n8n_data:
  chroma_data:
  engine_logs:
  cloudflare_creds:
